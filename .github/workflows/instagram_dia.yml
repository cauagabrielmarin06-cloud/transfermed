name: Instagram do dia seguinte

# Toda madrugada (03:30 em Brasília) monta o post do dia seguinte a partir da base (data/editais.json): JPEG 1080x1350 em
# docs/social/AAAA-MM-DD/ (link https público do Pages, que é o que o Instagram precisa para publicar) e a legenda e as fontes em
# docs/social/AAAA-MM-DD/legenda.txt e fontes.txt (o privado/ não vai para o Git; `python instagram_dia.py --sincronizar` copia para lá).
# Não publica no Instagram e não usa segredo nenhum: só gera arquivos. Pastas com mais de 14 dias são apagadas.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "dia da publicação AAAA-MM-DD (vazio = amanhã, em Brasília)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: escrita-no-repositorio
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar o gerador
        run: python -m unittest tests.test_instagram_dia

      # o registro é público: só o tipo do post e a quantidade de imagens
      - name: Gerar o post do dia seguinte
        env:
          DATA: ${{ github.event.inputs.data }}
        run: python instagram_dia.py ${DATA:+--data "$DATA"}

      - name: Publicar os arquivos no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/social
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "Instagram: post do dia seguinte"
          bash publicar_rodada.sh
