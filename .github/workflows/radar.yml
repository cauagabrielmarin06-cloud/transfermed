name: Radar de editais

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: escrita-no-repositorio   # o mesmo grupo do monitor: nunca dois envios ao mesmo tempo
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar as regras do robô
        run: python -m unittest discover tests

      - name: Rodar o radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ENVIO_IMEDIATO: ${{ vars.ENVIO_IMEDIATO }}
          AGENDA_UNICA: ${{ vars.AGENDA_UNICA }}
          CONTATO_EMAIL: ${{ vars.CONTATO_EMAIL }}
          CONTATO_ATIVO: ${{ vars.CONTATO_ATIVO }}
        run: python radar.py

      - name: Testar o site gerado (se falhar, nada é publicado)
        run: python -m unittest discover tests

      - name: Salvar resultados no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "Radar: atualização automática dos editais"
          git pull --rebase
          git push
